name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build for Linux AMD64
        run: |
          GOOS=linux GOARCH=amd64 go build -o nomad-tui-linux-amd64 .
          chmod +x nomad-tui-linux-amd64
          tar -czf nomad-tui-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz nomad-tui-linux-amd64

      - name: Build for Linux ARM64
        run: |
          GOOS=linux GOARCH=arm64 go build -o nomad-tui-linux-arm64 .
          chmod +x nomad-tui-linux-arm64
          tar -czf nomad-tui-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz nomad-tui-linux-arm64

      - name: Build for macOS AMD64
        run: |
          GOOS=darwin GOARCH=amd64 go build -o nomad-tui-darwin-amd64 .
          chmod +x nomad-tui-darwin-amd64
          tar -czf nomad-tui-${{ steps.version.outputs.VERSION }}-darwin-amd64.tar.gz nomad-tui-darwin-amd64

      - name: Build for macOS ARM64
        run: |
          GOOS=darwin GOARCH=arm64 go build -o nomad-tui-darwin-arm64 .
          chmod +x nomad-tui-darwin-arm64
          tar -czf nomad-tui-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz nomad-tui-darwin-arm64

      - name: Generate checksums
        run: |
          sha256sum nomad-tui-${{ steps.version.outputs.VERSION }}-*.tar.gz > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            nomad-tui-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz
            nomad-tui-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz
            nomad-tui-${{ steps.version.outputs.VERSION }}-darwin-amd64.tar.gz
            nomad-tui-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz
            checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
